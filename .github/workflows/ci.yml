name: ReEditX CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install web and desktop dependencies
        run: npm install
      - name: Check desktop and worker JavaScript syntax
        run: |
          node --check desktop/main.cjs
          node --check desktop/config.cjs
          node --check server/index.mjs
          node --check server/smoke-test.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Verify server package metadata
        run: node -e "const p=require('./server/package.json'); if (!p.scripts.start || !p.scripts.test || !p.dependencies.express || !p.dependencies.multer) process.exit(1)"
      - name: Install render worker dependencies
        run: npm install --prefix server
      - name: Render worker smoke test
        run: npm --prefix server test
