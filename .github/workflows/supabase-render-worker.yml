name: ReEditX Supabase Render Worker
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reeditx-supabase-render-worker
  cancel-in-progress: false
jobs:
  render-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      SUPABASE_URL: https://zyoyxjagyglngrlbnkwb.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.REEDITX_SUPABASE_SERVICE_ROLE_KEY }}
      REEDITX_STORAGE_BUCKET: reeditx-media
      NODE_ENV: production
      HOST: 127.0.0.1
      PORT: "8787"
      MAX_UPLOAD_MB: "50"
      MAX_CONCURRENT_RENDERS: "1"
      RENDER_API_TOKEN: "local-only-github-runner-token"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Validate Supabase worker secret
        shell: bash
        run: |
          if [[ -z "$SUPABASE_SERVICE_ROLE_KEY" ]]; then
            echo "::error::Create the repository secret REEDITX_SUPABASE_SERVICE_ROLE_KEY in Settings > Secrets and variables > Actions."
            exit 1
          fi
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install render worker dependencies
        run: npm install --prefix server
      - name: Drain the Supabase render queue
        shell: bash
        run: |
          set -euo pipefail
          export REEDITX_JOB_DIR="$RUNNER_TEMP/reeditx-jobs"
          mkdir -p "$REEDITX_JOB_DIR"
          node server/index.mjs > "$RUNNER_TEMP/reeditx-render-worker.log" 2>&1 &
          worker_pid=$!
          cleanup() { kill -TERM "$worker_pid" 2>/dev/null || true; wait "$worker_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          for _ in $(seq 1 40); do
            if curl -fsS "http://127.0.0.1:8787/health" >/dev/null; then break; fi
            if ! kill -0 "$worker_pid" 2>/dev/null; then cat "$RUNNER_TEMP/reeditx-render-worker.log"; exit 1; fi
            sleep 1
          done
          curl -fsS "http://127.0.0.1:8787/health" >/dev/null || { cat "$RUNNER_TEMP/reeditx-render-worker.log"; exit 1; }
          idle_seconds=0
          while true; do
            if ! kill -0 "$worker_pid" 2>/dev/null; then cat "$RUNNER_TEMP/reeditx-render-worker.log"; exit 1; fi
            health="$(curl -fsS "http://127.0.0.1:8787/health")"
            active="$(printf "%s" "$health" | jq -r ".active // 0")"
            now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            open_count="$(curl -fsS --get "$SUPABASE_URL/rest/v1/reeditx_render_jobs" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              --data-urlencode "select=id" \
              --data-urlencode "status=in.(queued,processing)" \
              --data-urlencode "expires_at=gt.$now" | jq "length")"
            if [[ "$open_count" == "0" && "$active" == "0" ]]; then
              idle_seconds=$((idle_seconds + 5))
              if (( idle_seconds >= 25 )); then echo "Queue empty; stopping this scheduled runner."; break; fi
            else
              idle_seconds=0
            fi
            sleep 5
          done
          cat "$RUNNER_TEMP/reeditx-render-worker.log"
