name: Build ReEditX.setup for Windows

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Version tag for the installer release (example: v1.0.0)"
        required: true
        type: string
        default: "v1.0.0"

permissions:
  contents: write

concurrency:
  group: reeditx-desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build Next.js standalone application
        run: npm run build

      - name: Build ReEditX.setup.exe
        run: npm run desktop:build

      - name: Smoke-test packaged local server
        shell: pwsh
        run: |
          $appDirectory = (Resolve-Path "release/win-unpacked").Path
          $resourceRoot = Join-Path $appDirectory "resources"
          $runtime = Join-Path $appDirectory "ReEditX.exe"
          $serverDirectory = Join-Path $resourceRoot "app-server"
          $serverEntry = Join-Path $serverDirectory "server.js"
          $buildId = Join-Path $serverDirectory ".next/BUILD_ID"
          foreach ($file in @($runtime, $serverEntry, $buildId)) {
            if (!(Test-Path $file -PathType Leaf)) { throw "Packaged runtime file is missing: $file" }
          }

          $portProbe = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          $portProbe.Start()
          $port = $portProbe.LocalEndpoint.Port
          $portProbe.Stop()
          $stdout = Join-Path $env:RUNNER_TEMP "reeditx-server.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "reeditx-server.stderr.log"
          $env:HOSTNAME = "127.0.0.1"
          $env:PORT = [string]$port
          $env:NODE_ENV = "production"
          $env:REEDITX_DESKTOP = "1"
          # Exercise the same embedded runtime path used by desktop/main.cjs.
          $env:ELECTRON_RUN_AS_NODE = "1"

          $process = Start-Process -FilePath $runtime -ArgumentList ('"' + $serverEntry + '"') -WorkingDirectory $serverDirectory -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          $healthy = $false
          try {
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              $process.Refresh()
              if ($process.HasExited) {
                $outText = if (Test-Path $stdout) { Get-Content $stdout -Raw } else { "" }
                $errText = if (Test-Path $stderr) { Get-Content $stderr -Raw } else { "" }
                throw ("Packaged server exited (code " + $process.ExitCode + ")." + [Environment]::NewLine + "STDOUT:" + [Environment]::NewLine + $outText + [Environment]::NewLine + "STDERR:" + [Environment]::NewLine + $errText)
              }
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:$port/api/health" -TimeoutSec 2 -UseBasicParsing
                if ($response.StatusCode -eq 200) {
                  $health = $response.Content | ConvertFrom-Json
                  if ($health.status -eq "ok") {
                    Write-Host "Packaged local server passed /api/health smoke test."
                    $healthy = $true
                    break
                  }
                }
              } catch {}
              Start-Sleep -Milliseconds 500
            }
            if (!$healthy) {
              $process.Refresh()
              $outText = if (Test-Path $stdout) { Get-Content $stdout -Raw } else { "" }
              $errText = if (Test-Path $stderr) { Get-Content $stderr -Raw } else { "" }
              throw ("Packaged server did not become healthy." + [Environment]::NewLine + "STDOUT:" + [Environment]::NewLine + $outText + [Environment]::NewLine + "STDERR:" + [Environment]::NewLine + $errText)
            }
          } finally {
            $process.Refresh()
            if (!$process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: List installer artifacts
        shell: pwsh
        run: Get-ChildItem release -Filter "*.exe" | Format-Table Name, Length

      - name: Publish installer to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && 'latest') || inputs.release_tag || github.ref_name }}
          name: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && 'ReEditX Latest') || format('ReEditX {0}', inputs.release_tag || github.ref_name) }}
          target_commitish: ${{ github.sha }}
          files: release/ReEditX.setup-*.exe
          generate_release_notes: true
          make_latest: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
